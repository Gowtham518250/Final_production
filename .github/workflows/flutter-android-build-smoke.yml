name: Flutter Android Build Smoke

on:
  pull_request:
    branches:
      - clean-retailmind-20261023
    paths:
      - "**/*.dart"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "android/**"
      - "packages/**"
      - ".github/workflows/flutter-android-build-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-build:
    name: Clean Android compile smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.x"
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          java -version

      - name: Remove stale build outputs
        run: |
          flutter clean
          rm -rf android/.gradle build .dart_tool

      - name: Resolve packages
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Compile Android debug APK
        run: flutter build apk --debug --no-pub

      - name: Publish smoke-test APK
        uses: actions/upload-artifact@v4
        with:
          name: retail-mind-android-debug-smoke
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
