name: Release Build (Android AAB + Web)

# Manual release gate. Required repository secrets:
# GOOGLE_SERVICES_JSON_BASE64
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# FIREBASE_WEB_API_KEY, FIREBASE_PROJECT_ID, FIREBASE_WEB_APP_ID
# FIREBASE_AUTH_DOMAIN, FIREBASE_STORAGE_BUCKET, FIREBASE_SENDER_ID
on:
  workflow_dispatch:
  push:
    branches:
      - fix/announcement-dedup-review-20261030

permissions:
  contents: read
  artifact-metadata: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.8"
          cache: true
      - name: Inject Firebase Android config and upload key
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo "GOOGLE_SERVICES_JSON_BASE64 secret missing"; exit 1; }
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret missing"; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("android/app/google-services.json").read_text())
          package_names = {
              item.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for item in config.get("client", [])
          }
          if "com.retailmind.app" not in package_names:
              raise SystemExit("Firebase config does not contain Android package com.retailmind.app")
          PY
          if grep -q "retail-mind-dev\|123456789012" android/app/google-services.json; then
            echo "google-services.json still contains placeholder values"; exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Check required signing secrets
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD secret missing"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS secret missing"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD secret missing"; exit 1; }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build signed Android App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: retail-mind-release-android
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  web-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.8"
          cache: true
      - name: Build Flutter web with Firebase configuration
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
        run: |
          test -n "$FIREBASE_WEB_API_KEY" || { echo "FIREBASE_WEB_API_KEY secret missing"; exit 1; }
          test -n "$FIREBASE_PROJECT_ID" || { echo "FIREBASE_PROJECT_ID secret missing"; exit 1; }
          test -n "$FIREBASE_WEB_APP_ID" || { echo "FIREBASE_WEB_APP_ID secret missing"; exit 1; }
          test -n "$FIREBASE_AUTH_DOMAIN" || { echo "FIREBASE_AUTH_DOMAIN secret missing"; exit 1; }
          test -n "$FIREBASE_STORAGE_BUCKET" || { echo "FIREBASE_STORAGE_BUCKET secret missing"; exit 1; }
          test -n "$FIREBASE_SENDER_ID" || { echo "FIREBASE_SENDER_ID secret missing"; exit 1; }
          flutter pub get
          flutter analyze
          flutter build web --release \
            --dart-define=FIREBASE_WEB_API_KEY="$FIREBASE_WEB_API_KEY" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_WEB_APP_ID="$FIREBASE_WEB_APP_ID" \
            --dart-define=FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN" \
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET" \
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID"
          grep -Fq "$FIREBASE_WEB_API_KEY" build/web/main.dart.js || {
            echo "Firebase web API key was not embedded in the compiled bundle"; exit 1;
          }
      - uses: actions/upload-artifact@v4
        with:
          name: retail-mind-web
          path: build/web
          if-no-files-found: error
