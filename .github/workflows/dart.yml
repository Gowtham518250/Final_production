name: Flutter CI

on:
  push:
    branches: [ "clean-retailmind-20261023", "feature/ai-help-support-screen-guidance-20261030" ]
  pull_request:
    branches: [ "clean-retailmind-20261023" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        # Keep the existing warning/info backlog visible but do not let it mask errors.
        shell: bash
        run: |
          set +e
          if analysis_output="$(flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1)"; then
            analyze_status=0
          else
            analyze_status=$?
          fi
          printf '%s\n' "$analysis_output"

          if printf '%s\n' "$analysis_output" | grep -Eq '^[[:space:]]*error[[:space:]]+-'; then
            echo "Analyzer reported at least one error diagnostic."
            exit 1
          fi

          if [ "$analyze_status" -ne 0 ]; then
            echo "::warning::flutter analyze returned $analyze_status without errors; warning/info backlog remains non-blocking."
          fi

          echo "::notice::Warning and info diagnostics remain visible above; only analyzer errors fail this step."
          exit 0

      - name: Run Flutter tests
        run: flutter test
