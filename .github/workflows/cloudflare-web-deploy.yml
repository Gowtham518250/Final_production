name: Deploy Flutter Web to Cloudflare Workers

on:
  push:
    branches:
      - clean-retailmind-20261023
    paths:
      - "lib/**"
      - "assets/**"
      - "web/**"
      - "packages/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-web-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-web-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy Flutter web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.x"
          cache: true

      - name: Set up Node.js for Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build production web app
        run: flutter build web --release --base-href /

      - name: Verify Flutter web output
        run: test -s build/web/index.html

      - name: Check Cloudflare deployment secrets
        id: cloudflare_credentials
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CF_API_TOKEN" && -n "$CF_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.cloudflare_credentials.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Explain skipped deployment
        if: steps.cloudflare_credentials.outputs.configured != 'true'
        shell: bash
        run: |
          {
            echo "### Cloudflare deployment skipped"
            echo "The Flutter web build completed, but deployment secrets are not configured."
            echo "Add repository Actions secrets named `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID`, then run this workflow again."
          } >> "$GITHUB_STEP_SUMMARY"
