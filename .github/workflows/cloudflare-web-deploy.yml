name: Deploy Flutter Web to Cloudflare Workers

on:
  push:
    branches:
      - clean-retailmind-20261023
    paths:
      - "lib/**"
      - "assets/**"
      - "web/**"
      - "packages/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-web-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-web-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy Flutter web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.x"
          cache: true

      - name: Set up Node.js for Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build production web app
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          missing=()
          [[ -z "$FIREBASE_WEB_API_KEY" ]] && missing+=("FIREBASE_WEB_API_KEY")
          [[ -z "$FIREBASE_PROJECT_ID" ]] && missing+=("FIREBASE_PROJECT_ID")
          [[ -z "$FIREBASE_WEB_APP_ID" ]] && missing+=("FIREBASE_WEB_APP_ID")
          [[ -z "$FIREBASE_SENDER_ID" ]] && missing+=("FIREBASE_SENDER_ID")
          [[ -z "$GOOGLE_OAUTH_CLIENT_ID" ]] && missing+=("GOOGLE_OAUTH_CLIENT_ID")
          if ((${#missing[@]})); then
            echo "Missing web dart-define secrets: ${missing[*]}"
            echo "Add them under repository Actions secrets, then rebuild."
            exit 1
          fi
          flutter build web --release --base-href / \
            --dart-define=API_BASE_URL="${API_BASE_URL:-https://retail-mind-hpx3.onrender.com}" \
            --dart-define=FIREBASE_WEB_API_KEY="$FIREBASE_WEB_API_KEY" \
            --dart-define=FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET" \
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID" \
            --dart-define=FIREBASE_WEB_APP_ID="$FIREBASE_WEB_APP_ID" \
            --dart-define=GOOGLE_OAUTH_CLIENT_ID="$GOOGLE_OAUTH_CLIENT_ID" \
            --dart-define=LOG_LEVEL=WARNING \
            --dart-define=ENABLE_REMOTE_LOGGING=false \
            --dart-define=APP_VERSION=1.0.1+2

      - name: Verify Flutter web output
        run: test -s build/web/index.html

      - name: Check Cloudflare deployment secrets
        id: cloudflare_credentials
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CF_API_TOKEN" && -n "$CF_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.cloudflare_credentials.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Explain skipped deployment
        if: steps.cloudflare_credentials.outputs.configured != 'true'
        shell: bash
        run: |
          {
            echo "### Cloudflare deployment skipped"
            echo "The Flutter web build completed, but deployment secrets are not configured."
            echo "Add repository Actions secrets named `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID`, then run this workflow again."
          } >> "$GITHUB_STEP_SUMMARY"
