name: Flutter CI

on:
  workflow_dispatch:
  push:
    branches: [ "clean-retailmind-20261023", "chore/**", "feature/**" ]
  pull_request:
    branches: [ "clean-retailmind-20261023" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        # Errors fail the job. --no-fatal-warnings/--no-fatal-infos keep the
        # existing warning backlog visible without masking real errors.
        # Flutter prints "error • ..." (bullet), not "error -".
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test
