name: Flutter Web Build Smoke

on:
  pull_request:
    branches:
      - clean-retailmind-20261023
    paths:
      - "**/*.dart"
      - "web/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "packages/**"
      - ".github/workflows/flutter-web-build-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-release-build:
    name: Flutter web release compile
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.x"
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Resolve packages
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release

      - name: Verify web entrypoint was generated
        run: test -s build/web/index.html
